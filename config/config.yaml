database:
  name: network_security
  collection: network_logs

paths:
  raw_data: data/raw/network_data.csv
  train_data: data/processed/train.csv
  test_data: data/processed/test.csv
  processed_data: data/processed/processed_data.csv
  model: saved_models/model.pkl

data_ingestion:
  test_size: 0.2

data_validation:
  validation_report_path: artifacts/data_validation/validation_report.json
  drift_p_value_threshold: 0.05
  missing_value_threshold: 0.0

data_transformation:
  transformed_train_path: data/processed/transformed_train.csv
  transformed_test_path: data/processed/transformed_test.csv
  preprocessor_path: artifacts/preprocessor/preprocessor.pkl
  apply_smote: true
  smote_random_state: 42

model_training:
  trained_model_path: artifacts/saved_model/model.pkl

model_evaluation:
  evaluation_report_path: artifacts/model_evaluation/evaluation_report.json
  min_accuracy_threshold: 0.85
  min_f1_threshold: 0.85

