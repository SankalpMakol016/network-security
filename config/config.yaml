database:
  name: network_security
  collection: network_logs

paths:
  raw_data: data/raw/network_data.csv
  train_data: data/processed/train.csv
  test_data: data/processed/test.csv
  processed_data: data/processed/processed_data.csv
  model: saved_models/model.pkl

data_ingestion:
  test_size: 0.2

data_validation:
  validation_report_path: artifacts/data_validation/validation_report.json
  drift_p_value_threshold: 0.05
  missing_value_threshold: 0.0
